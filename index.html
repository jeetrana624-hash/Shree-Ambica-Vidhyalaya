<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ambica Vidhyalaya - Management System</title>
      <link rel="stylesheet" href='style.css'>
</head>
<body>

    <div class="container">
        <!-- હેડર / સ્કૂલનું નામ -->
        <header class="school-header">
            <h1>Shree Ambica Vidhyalaya</h1>
            <p class="subtitle">School Management System</p>
        </header>

        <!-- વિદ્યાર્થી એડ કરવાનું ફોર્મ -->
        <div class="form-container">
            <input type="text" id="name" placeholder="વિદ્યાર્થીનું નામ" required>
            <input type="text" id="roll_no" placeholder="રોલ નંબર" required>
            <input type="text" id="standard" placeholder="ધોરણ (Class)" required>
            <button onclick="addStudent()">Add Student</button>
        </div>

        <!-- વિદ્યાર્થીઓનું ટેબલ -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>નામ</th>
                        <th>રોલ નંબર</th>
                        <th>ધોરણ</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- JavaScript દ્વારા ડેટા ઉમેરાશે -->
                </tbody>
            </table>
        </div>

        <!-- ક્રેડિટ્સ / ડેવલપર્સ -->
        <footer class="credits-footer">
            <p><strong>Made by:</strong></p>
            <div class="team-members">
                <span>Jeet J. Rana</span> • 
                <span>Gopal H. Valiya</span> • 
                <span>Divy S. Pipaliya</span> • 
                <span>Vedant J. Panchal</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
