<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ambica Vidhyalaya - Management & Portal</title>
    <!-- GitHub Pages mate sidho path -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Modal (3D Card) -->
    <div id="login-modal" class="modal-overlay">
        <div class="card-3d login-card">
            <h2>Shree Ambica Vidhyalaya</h2>
            <p class="tagline">School Portal Login</p>

            <div class="role-selector">
                <button type="button" id="role-school" class="active" onclick="setRole('school')">School Admin</button>
                <button type="button" id="role-student" onclick="setRole('student')">Student</button>
            </div>

            <!-- Standard Login Form -->
            <div id="credential-login">
                <input type="text" id="user-identifier" placeholder="Username / Mobile / Email" required>
                <input type="password" id="user-password" placeholder="Password" required>
                <button type="button" class="btn-3d btn-primary btn-block" onclick="loginWithCredentials()">Login</button>
            </div>

            <div class="divider"><span>OR</span></div>

            <!-- Alternate Login Options -->
            <div class="alt-options">
                <button type="button" class="btn-3d btn-secondary btn-block" onclick="toggleOtpView()">Login with Mobile OTP</button>

                <!-- OTP Section (Hidden by default) -->
                <div id="otp-section" style="display: none; margin-top: 10px;">
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="mobile-otp-input" placeholder="10 Digit Mobile Number">
                        <button type="button" class="btn-3d btn-primary" onclick="sendOTP()">Send OTP</button>
                    </div>
                    <input type="text" id="otp-verify-input" placeholder="Enter OTP (1234)">
                    <button type="button" class="btn-3d btn-accent btn-block" onclick="verifyOTP()">Verify & Login</button>
                </div>

                <button type="button" class="btn-3d btn-google btn-block" onclick="loginWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Main Portal Area -->
    <div class="container" id="main-content" style="display:none;">
        <header class="school-header card-3d">
            <div class="header-top">
                <h1>Shree Ambica Vidhyalaya</h1>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
            <p class="subtitle">Management System (<span id="user-badge">Admin</span>)</p>
        </header>

        <!-- Admin Registration Section -->
        <section id="admin-panel" class="card-3d form-section">
            <h3>Navo Vidyarthi Add Karo</h3>
            <div class="form-container">
                <input type="text" id="name" placeholder="Student Name">
                <input type="text" id="roll_no" placeholder="Roll Number">
                <input type="text" id="standard" placeholder="Standard">
                <button class="btn-3d btn-primary" onclick="addStudent()">Add Student</button>
            </div>
        </section>

        <!-- Student Records Table -->
        <section class="card-3d table-section">
            <h3>Vidyarthio ni Yaadi</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Naam</th>
                            <th>Roll No</th>
                            <th>Dhoran</th>
                            <th id="action-header">Action</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body"></tbody>
                </table>
            </div>
        </section>

        <footer class="card-3d credits-footer">
            <p><strong>Made by:</strong></p>
            <div class="team-members">
                <span>Jeet J. Rana</span> • 
                <span>Gopal H. Valiya</span> • 
                <span>Divy S. Pipaliya</span> • 
                <span>Vedant J. Panchal</span>
            </div>
        </footer>
    </div>

    <!-- GitHub Pages mate sidho script path -->
    <script src="script.js"></script>
</body>
</html>
